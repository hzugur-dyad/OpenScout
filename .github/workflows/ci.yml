# OpenScout — CI and optional Vercel CLI deploy
#
# Triggers: pushes to `main`, pull requests targeting `main`.
#
# Deployments (pick ONE to avoid double deploys):
#   A) Recommended: connect this repo in the Vercel dashboard (Git integration).
#      → `main` → Production, other branches → Preview. No deploy job needed.
#   B) Optional: set repo Variable ENABLE_VERCEL_CLI=true and add VERCEL_* secrets
#      (see docs/CI_CD.md). Disable automatic Git deployments in Vercel if you use B.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openscout-app
    env:
      OPENSCOUT_ENV_PROFILE: ci
      NEXT_TELEMETRY_DISABLED: "1"
      # Avoid intermittent OOM / slow GC on ubuntu-latest during `next build` + Vitest.
      NODE_OPTIONS: --max-old-space-size=6144
      # Secrets override placeholders when set (closer to production). Placeholders keep
      # `next build` working on forks / before secrets are configured. See docs/CI_CD.md.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MTkwMDAwMDAwMH0.placeholder' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder' }}
      GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY || 'ci-placeholder' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_ci_placeholder' }}
      STRIPE_CANDIDATE_PLUS_PRICE_ID: ${{ secrets.STRIPE_CANDIDATE_PLUS_PRICE_ID || 'price_ci_plus' }}
      STRIPE_CANDIDATE_PRO_PRICE_ID: ${{ secrets.STRIPE_CANDIDATE_PRO_PRICE_ID || 'price_ci_pro' }}
      STRIPE_EMPLOYER_GROWTH_PRICE_ID: ${{ secrets.STRIPE_EMPLOYER_GROWTH_PRICE_ID || 'price_ci_growth' }}
      STRIPE_EMPLOYER_SCALE_PRICE_ID: ${{ secrets.STRIPE_EMPLOYER_SCALE_PRICE_ID || 'price_ci_scale' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://ci-placeholder.upstash.io' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'ci-placeholder' }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || '' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openscout-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate CI environment
        run: npm run validate-env

      - name: Lint
        run: npm run lint

      # Fresh checkout has no .next; this clears stale generated types on self-hosted/cache restores.
      - name: Clear Next.js build cache
        run: rm -rf .next

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Production build
        run: npm run build

  # Optional: Vercel via CLI. Enable with repo Variable ENABLE_VERCEL_CLI = true
  # (Settings → Secrets and variables → Actions → Variables).
  deploy-vercel:
    name: Deploy (Vercel CLI)
    needs: ci
    # Skip fork PRs (untrusted code); secrets still exist on base repo workflows — do not deploy them.
    if: |
      vars.ENABLE_VERCEL_CLI == 'true' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: openscout-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # main → production (--prod); PRs and other pushes → preview. Posts preview URL on PR when github-token is set.
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: openscout-app
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: ${{ github.event_name == 'pull_request' }}
